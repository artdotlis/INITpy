services:
    scaffolder:
        build:
            context: .
            dockerfile: configs/docker/prod.Dockerfile
            secrets:
                - env_file
            args:
                USERNAME: runner
                USER_UID: ${USER_UID:-1000}
                USER_GID: ${USER_GID:-1000}
                WORK_DIR: '/workspace'
                BIN_DEPLOY_PREP: ${BIN_DEPLOY_PREP}
                BIN_DEPLOY_REQ: ${BIN_DEPLOY_REQ}
                BIN_DEPLOY_USER: ${BIN_DEPLOY_USER}
        environment:
            SCAF_OUTPUT_DIR: /scaf
        volumes:
            - ${SCAF_OUTPUT_DIR:-./PROJECTS}:/scaf
        stdin_open: true
        tty: true

secrets:
    env_file:
        file: ./.env
