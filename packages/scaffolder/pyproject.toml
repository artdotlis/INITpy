[project]
classifiers = ["Private :: Do Not Upload"]
name = "scaffolder"
version = "0.11.0"
description = "Automation suite for INITpy-based projects."
readme = "README.md"
authors = [
    { name = "artdotlis", email = "artdotlis@pm.me" }
]
requires-python = ">=3.13,<4"
dependencies = [
  "shared_utils",
  "reuse ==6.2.0",
  "tomlkit ==0.15.1"
]

[project.scripts]
scaffolder = "scaffolder.main:run_cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scaffolder"]

[build-system]
requires = ["uv_build>=0.11.26,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared_utils = {  workspace = true }

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["__pycache__", ".pytest_cache"]

[tool.coverage.run]
source = ["scaffolder"]
omit = ["tests/*"]
data_file = ".coverage.scaffolder"

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
