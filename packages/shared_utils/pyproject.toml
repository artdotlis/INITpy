[project]
classifiers = ["Private :: Do Not Upload"]
name = "shared-utils"
version = "0.11.0"
description = "Shared library for packages."
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
  "tomlkit ==0.15.1"
]
authors = [
    { name = "artdotlis", email = "artdotlis@pm.me" }
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["shared_utils"]

[build-system]
requires = ["uv_build>=0.11.26,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["__pycache__", ".pytest_cache"]

[tool.coverage.run]
source = ["shared_utils"]
omit = ["tests/*"]
data_file = ".coverage.shared_utils"

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
