# VitePress config

[site]
title = "INIT - Python"
description = "INITpy documentation"

[vitepress]
base = "/INITpy/"
cleanUrls = true
lastUpdated = true
srcDir = "src"
theme = "./theme"

[vitepress.markdown.theme]
light = "vitesse-light"
dark = "vitesse-dark"

[vitepress.themeConfig]
license = "Unlicense"

[vitepress.themeConfig.logo]
value = "🛠️"

[vitepress.themeConfig.search]
provider = "local"

[[vitepress.themeConfig.socialLinks]]
icon = "github"
link = "https://github.com/artdotlis/INITpy"

[[vitepress.themeConfig.nav]]
text = "Home"
link = "/"

[[vitepress.themeConfig.nav]]
text = "About"
link = "/about/"

[[vitepress.themeConfig.nav]]
text = "License"
link = "/license/"

[[vitepress.themeConfig.nav]]
text = "API"
link = "/ref/"

[[vitepress.themeConfig.footer]]
copyright = "Copyright © 2026 Artur Lissin"
