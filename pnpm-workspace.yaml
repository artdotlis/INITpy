# Root level pnpm workspace configuration
saveExact: true
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

lockfile: true
preferFrozenLockfile: true

packages:
  - "packages/docs"

# Define catalog of dependency versions (source of truth)
catalog:
  eslint: "^9.21.0"
  prettier: "^3.5.2"
  "@typescript-eslint/parser": "^8.26.0"
  "@typescript-eslint/eslint-plugin": "^8.26.0"
